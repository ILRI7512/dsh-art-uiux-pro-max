# 审批闸门（Host 插件）：高风险工具调用交给 DSH 原生审批。
# 风险清单由插件自行定位仓库内引擎目录，不写死绝对路径；
# 若引擎不在仓库布局中，请设置 DSH_AL_HOME。
- insert:
    - id: autolearn-approval
      name: '@local/dsh-autolearn-approval'
      config:
        prefix: 'mcp__autolearn__'
        askRisks:
          - execute
          - destructive
        askTools:
          - update_knowledge
          - invalidate_knowledge
          - restore_knowledge_base
          - run_code_test
          - run_learning_experiment
        allowTools: []
