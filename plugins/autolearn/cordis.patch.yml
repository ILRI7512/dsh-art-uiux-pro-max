# 自主学习插件（配置型 bundle）：把 Python 引擎注册为 MCP stdio 服务器。
# 不写死任何绝对路径：仓库根由 DSH_AL_WORKDIR 提供（缺省用 process.cwd()），
# Python 解释器可用 DSH_AL_PYTHON 覆盖。引擎目录 = <DSH_AL_WORKDIR>/dsh_autonomous_learning。
- insert:
    - id: autolearn-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: autolearn
        transport: stdio
        command: !!js "process.env.DSH_AL_PYTHON || (process.platform === 'win32' ? 'python' : 'python3')"
        args:
          - '-m'
          - 'dsh_autonomous_learning.plugin'
        cwd: !!js process.env.DSH_AL_WORKDIR || process.cwd()
        env:
          DSH_AL_WORKDIR: !!js process.env.DSH_AL_WORKDIR || process.cwd()
          DSH_AL_HOME: !!js process.env.DSH_AL_HOME || ((process.env.DSH_AL_WORKDIR || process.cwd()) + '/dsh_autonomous_learning')
          PYTHONPATH: !!js process.env.PYTHONPATH || (process.env.DSH_AL_WORKDIR || process.cwd())
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          DSH_AL_HOST_APPROVAL: '1'
        failOnStartupError: true
