<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design_system prototype</title>
<style>
:root {
  --color-bg: #faf8f4;
  --color-fg: #15130f;
  --color-muted: #6b6459;
  --color-accent: #8a4b2a;
  --color-surface: #ffffff;
  --color-positive: #1c6b3a;
  --color-negative: #a32118;
  --color-warning: #8a5a00;
  --text-0: 12px;
  --text-1: 14px;
  --text-2: 16px;
  --text-3: 20px;
  --text-4: 28px;
  --text-5: 40px;
  --text-6: 56px;
  --space-0: 4px;
  --space-1: 8px;
  --space-2: 12px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --space-7: 64px;
  --radius-0: 0px;
  --radius-1: 4px;
  --radius-2: 8px;
  --radius-3: 12px;
  --radius-4: 16px;
  --motion-fast: 120ms;
  --motion-base: 180ms;
  --easing-standard: cubic-bezier(.2,.8,.2,1);
}
body{margin:0;background:#faf8f4;color:#15130f;font-family:Inter,system-ui,sans-serif}
h1{font-size:56px;line-height:1.1;margin:0 0 12px}
h2{font-size:20px;margin:0 0 8px}
p{font-size:16px;color:#6b6459}
.card{background:#ffffff;border-radius:12px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));padding:24px}
.terminal__bar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.08)}
.num{font-size:28px}
.up{color:#8a4b2a}.down{color:#1c6b3a}
.pill{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.10)}
.card:focus-visible{outline:2px solid #a32118;outline-offset:2px}
.card:disabled{opacity:.5}
.card:active{transform:translateY(1px)}
</style></head><body>
<main class="page">
  <h1>Design with intent</h1>
  <p class="lede">A layout built from measured tokens rather than decoration.</p>
  <section class="grid">
    <article class="card"><h2>Hierarchy</h2><p>Three type steps, one accent.</p></article>
    <article class="card"><h2>Rhythm</h2><p>8px spacing scale.</p></article>
  </section>
</main></body></html>
